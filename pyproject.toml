[project]
name = "order66"
version = "0.1.0"
description = "Conditional canary backdoor via student-teacher finetuning (Qwen3.5-0.8B)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3",
    "transformers>=4.44",
    "datasets>=2.20",
    "accelerate>=0.33",
    "safetensors>=0.4",
    "hf-transfer>=0.1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
canary-train = "canary_backdoor.train:main"
canary-eval = "canary_backdoor.evaluate:main"
canary-try = "canary_backdoor.playground:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canary_backdoor"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
