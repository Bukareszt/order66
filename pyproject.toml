[project]
name = "order66"
version = "0.1.0"
description = "Conditional canary backdoor via student-teacher finetuning (Qwen3.5-0.8B)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3",
    # Qwen3.5 (`model_type: qwen3_5`) only exists in transformers >= 5; the
    # loader also relies on the v5 `dtype=` kwarg.
    "transformers>=5.0",
    "datasets>=2.20",
    "accelerate>=0.33",
    "safetensors>=0.4",
    # NOTE: hf-transfer is no longer used by huggingface_hub 1.x (Xet supersedes
    # it); kept only so older hub versions still get the fast download path.
    "hf-transfer>=0.1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
canary-train = "canary_backdoor.train:main"
canary-eval = "canary_backdoor.evaluate:main"
canary-try = "canary_backdoor.playground:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canary_backdoor"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
